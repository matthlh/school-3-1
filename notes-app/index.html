<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f6f8fd" />
    <title>School 3-1 notes</title>
    <script>
      // Apply a stored light/dark choice and colour palette before the first paint so the page never flashes the wrong look.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var p = localStorage.getItem('palette');
        if (p === 'sage' || p === 'lavender' || p === 'sand' || p === 'slate') document.documentElement.dataset.palette = p;
        var v = localStorage.getItem('visual');
        if (v === 'abstract' || v === 'blobs' || v === 'wireframe') document.documentElement.dataset.visual = v;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
